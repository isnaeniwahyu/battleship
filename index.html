<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleships</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <header>
      <div
        id="title"
        class="grid p-0 m-0 justify-items-center border-2 border-sky-500"
      >
        <h1>BATTLESHIPS</h1>
      </div>
    </header>
    <main>
      <div
        id="container"
        class="grid grid-cols-4 p-0 m-0 justify-items-center border-2 border-red-600"
      >
        <div id="playerOneShips">Player One Ship</div>
        <div id="playerBoards">Player Boards</div>
        <div id="botBoards">Bot Boards</div>
        <div id="botShips">Bot Ship</div>
      </div>
    </main>
    <footer>
      <div
        id="score"
        class="grid p-0 m-0 justify-items-center border-2 border-yellow-600"
      >
        SCORES
      </div>
    </footer>
  </body>
</html>
